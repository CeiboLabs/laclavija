# No es un monorepo — usamos este archivo solo para configuracion de pnpm.
# El campo `packages` es obligatorio en pnpm 10.x aunque solo declaremos el
# root como package. Con `.` decimos "este proyecto es el unico package".
packages:
  - "."

# Skippear el check automatico de deps al arrancar comandos (bug con Node 25 local).
verify-deps-before-run: false

# Aprobar builds de dependencias con scripts nativos.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
